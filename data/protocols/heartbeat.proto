syntax = "proto3";
package protocols.world.heartbeat;

// 心跳请求 - 客户端定期发送
message HeartbeatRequest {
    int64 timestamp = 1;  // 客户端时间戳（毫秒）
    int32 status = 2;     // 玩家状态 (0:正常,1:忙碌,2:离开)
}

// 心跳响应 - 服务器回复
message HeartbeatResponse {
    int64 timestamp = 1;  // 服务器时间戳（毫秒）
    int64 client_timestamp = 2; // 客户端时间戳（用于计算延迟）
    int32 result_code = 3; // 0:成功
}

// 玩家在线状态查询请求
message PlayerOnlineStatusRequest {
    string user_id = 1;   // 要查询的玩家ID
}

// 玩家在线状态查询响应
message PlayerOnlineStatusResponse {
    string user_id = 1;
    bool is_online = 2;   // 是否在线
    int32 status = 3;     // 玩家状态 (0:离线,1:在线,2:忙碌,3:离开)
    int64 last_seen = 4;  // 最后在线时间戳
    int32 result_code = 5; // 0:成功, -1:玩家不存在
}

// 批量在线状态查询请求
message BatchOnlineStatusRequest {
    repeated string user_ids = 1; // 玩家ID列表
}

// 批量在线状态查询响应
message BatchOnlineStatusResponse {
    repeated PlayerOnlineStatusResponse players = 1;
    int32 result_code = 2;
}