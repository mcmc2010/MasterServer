syntax = "proto3";
package protocols.world.presence;

// 玩家上线通知 - 广播给相关玩家
message PlayerOnlineNotify {
    string user_id = 1;
    string user_name = 2;
    int32 level = 3;
    int64 timestamp = 4;
}

// 玩家下线通知 - 广播给相关玩家
message PlayerOfflineNotify {
    string user_id = 1;
    string user_name = 2;
    int64 timestamp = 3;
}

// 玩家状态变化通知
message PlayerStatusChangeNotify {
    string user_id = 1;
    string user_name = 2;
    int32 old_status = 3;
    int32 new_status = 4;
    int64 timestamp = 5;
}

// 请求好友在线列表
message FriendsOnlineListRequest {
    string user_id = 1;
}

// 好友在线列表响应
message FriendsOnlineListResponse {
    string user_id = 1;
    repeated FriendOnlineStatus friends = 2;
    int32 result_code = 3;
}

// 好友在线状态
message FriendOnlineStatus {
    string user_id = 1;
    string user_name = 2;
    int32 level = 3;
    bool is_online = 4;
    int32 status = 5; // 0:离线,1:在线,2:忙碌,3:离开
    int64 last_seen = 6;
}